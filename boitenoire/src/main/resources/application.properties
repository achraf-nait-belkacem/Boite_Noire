spring.application.name=boitenoire

# Spring Boot 4 renamed spring.data.mongodb.uri to spring.mongodb.uri
spring.mongodb.uri=mongodb://localhost:27017/pigeon

# Data generator (profile "generator")
generator.seed=42
generator.user-count=2000
generator.event-count=150000
